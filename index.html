<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Night-West-RP Interaktive Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #1a1a1a;
      margin: 0; padding: 0;
      color: white;
    }
    #map {
      width: 100%;
      max-width: 900px;
      height: 600px;
      margin: 20px auto;
      border: 2px solid #444;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 20px;
      color: white;
    }
    p {
      color: #ccc;
    }
  </style>
</head>
<body>

<h1>Night-West-RP Interaktive Map</h1>
<p>Klicke auf die Marker, um Infos zu sehen.</p>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Bildgröße der Map
  var mapWidth = 2512;
  var mapHeight = 1878;
  var bounds = [[0, 0], [mapHeight, mapWidth]];

  // Leaflet Karte initialisieren mit einfachem Koordinatensystem
  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2,
    zoomControl: true
  });

  // Bild-Overlay (deine Karte, WebP oder PNG)
  var imageUrl = 'rdo_map.webp'; // Pfad zu deinem Bild
  L.imageOverlay(imageUrl, bounds).addTo(map);

  // Ansicht auf das gesamte Bild setzen
  map.fitBounds(bounds);

  // Icon für Holzverkauf
  var iconHolzverkauf = L.icon({
    iconUrl: 'holz_marker.png',
    iconSize: [40, 40],
    iconAnchor: [20, 40],
    popupAnchor: [0, -40]
  });

  // Marker mit eigenem Icon
  var markerHolz = L.marker([1350, 2250], { icon: iconHolzverkauf }).addTo(map);
  markerHolz.bindPopup("<b>Holz</b><br>Hier kannst du Holz abholen, um Geld zu verdienen.");

  // Andere Marker (Standard-Icon)
  var markerFischmarkt = L.marker([900, 1500]).addTo(map);
  markerFischmarkt.bindPopup("<b>Fischmarkt</b><br>Fische verkaufen und kaufen.");

  var markerStall = L.marker([500, 1000]).addTo(map);
  markerStall.bindPopup("<b>Stall</b><br>Pferde kaufen und verkaufen.");
</script>

</body>
</html>
